name: Deploy

# Rolling deploy to staging → smoke tests → promote to prod.
# Triggered when a GitHub Release is published (by release.yml) or manually.
# Fill in the marked deploy/smoke steps with your actual infra commands
# (kubectl rollout, docker stack deploy, Helm, etc.). Rollouts are health-checked.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag) to deploy
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
