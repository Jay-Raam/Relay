          echo "e.g. docker buildx build -f infra/docker/api.Dockerfile -t \$REGISTRY/relay-api:${{ github.ref_name }} --push ."

  deploy-staging:
    name: Rolling deploy → staging
    needs: build-images
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.relay.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Rolling deploy (one node at a time, behind health checks)
        run: |
          echo "TODO: rolling deploy to staging"
          echo "Expand–migrate–contract DB migration runs first, then rolling update."

  smoke-staging:
    name: Smoke tests (staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run smoke tests against staging
