name: CI

# Lint + typecheck → unit tests → build → integration tests.
# Runs on every pull request and every push. Every merge to main must be green.

on:
  pull_request:
  push:
    branches: ['**']

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR commit messages (commitlint)
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint (0 warnings allowed)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Spin up the dev stack (Postgres/Timescale + Redis + Mosquitto) if present.
      - name: Start stack (docker compose)
        id: stack
        run: |
          if [ -f infra/compose/docker-compose.yml ]; then
            docker compose -f infra/compose/docker-compose.yml up -d --wait
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "No compose file yet — skipping integration stack."
            echo "started=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests
        if: steps.stack.outputs.started == 'true'
        run: pnpm turbo run test:integration

      - name: Tear down
        if: always() && steps.stack.outputs.started == 'true'
        run: docker compose -f infra/compose/docker-compose.yml down -v
